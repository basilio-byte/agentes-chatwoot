name: Publicar imagem no GHCR

# Todo push na main gera uma imagem nova em ghcr.io, pronta para o Easypanel puxar.
# Tags v* também publicam, para quando quiser fixar uma versão em produção.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Push novo na main cancela o build anterior que ainda estiver rodando.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Token gerado pelo próprio Actions — não precisa criar PAT.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre execuções: a camada pesada (CLI do Prisma, node_modules)
          # só é reconstruída quando as dependências mudam.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sem attestation: ela cria manifests "unknown/unknown" que poluem a
          # listagem do pacote e o Easypanel não usa.
          provenance: false

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disparar deploy no Easypanel (opcional)
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Secret EASYPANEL_DEPLOY_WEBHOOK não configurado — deploy manual."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK"
          echo "Deploy disparado no Easypanel."
